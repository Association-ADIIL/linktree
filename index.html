  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Outfit", sans-serif;
      background: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .page {
      display: flex;
      gap: 32px;
      max-width: 1020px;
      width: 100%;
      align-items: flex-start;
    }

    /* ── PROFILE ── */
    .profile {
      flex: 0 0 210px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 6px;
    }
    .avatar {
      width: 110px; height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .profile-name {
      font-size: 1.85rem; font-weight: 800;
      color: #111; line-height: 1.1; letter-spacing: -0.5px;
    }
    .profile-bio {
      font-size: .88rem; color: #666;
      line-height: 1.55; font-weight: 400;
    }
    .profile-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .tag {
      font-size: .72rem; font-weight: 600;
      padding: 4px 10px; border-radius: 999px;
      background: #fff; color: #555; border: 1px solid #e0e0e0;
    }

    /* ── BENTO GRID ── */
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    /* ── BASE CARD ── */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      display: flex; flex-direction: column; gap: 7px;
      transition: transform .2s ease, box-shadow .2s ease;
      text-decoration: none; color: inherit; overflow: hidden;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.10), 0 2px 4px rgba(0,0,0,0.06);
    }

    .col-2 { grid-column: span 2; }
    .col-3 { grid-column: span 3; }
    .col-4 { grid-column: span 4; }

    .card-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }
    .card-title  { font-size: .92rem; font-weight: 700; color: #111; }
    .card-sub    { font-size: .74rem; color: #aaa; font-weight: 400; }
    .card-desc   { font-size: .78rem; color: #666; line-height: 1.45; margin-top: 2px; }

    /* ── BUTTON ── */
    .btn {
      display: inline-flex; align-items: center;
      justify-content: center; gap: 6px;
      padding: 8px 16px; border-radius: 999px;
      font-family: "Outfit", sans-serif;
      font-size: .78rem; font-weight: 700;
      border: none; cursor: pointer;
      text-decoration: none; width: fit-content;
      margin-top: auto;
      transition: opacity .2s, transform .15s;
    }
    .btn:hover { opacity: .85; transform: scale(1.04); }
    .btn i { position: relative; top: 0.5px; }

    /* ── PROJECT CARDS ── */
    .tint-adiil  { background: #effdf7; }
    .tint-cinema { background: #fff1f1; }

    .ic-adiil  { background: #d1fae5; color: #10b981; }
    .ic-cinema { background: #fee2e2; color: #dc2626; }

    .btn-adiil  { background: #6ee7b7; color: #0f2920; }
    .btn-cinema { background: #dc2626; color: #fff; }

    /* ── FOOTER ── */
    .footer {
      grid-column: 1 / -1;
      text-align: center;
      font-size: .7rem; color: #bbb;
      padding: 4px 0 0;
      display: flex; align-items: center;
      justify-content: center; gap: 10px;
    }
    .footer-link {
      color: #bbb; text-decoration: none;
      font-size: .7rem; cursor: pointer;
      transition: color .2s;
    }
    .footer-link:hover { color: #888; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #111; color: #fff;
      font-family: "Outfit", sans-serif;
      font-size: .82rem; font-weight: 500;
      padding: 10px 22px; border-radius: 999px;
      opacity: 0; transition: all .4s cubic-bezier(.22,1,.36,1);
      pointer-events: none; z-index: 9999;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── MODAL MENTIONS ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .3s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: #fff;
      border-radius: 24px;
      padding: 36px 32px;
      max-width: 500px; width: 100%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.18);
      transform: translateY(20px) scale(0.97);
      transition: transform .35s cubic-bezier(.22,1,.36,1);
      max-height: 80vh; overflow-y: auto;
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }
    .modal-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 24px;
    }
    .modal-title {
      font-size: 1.15rem; font-weight: 800;
      color: #111; letter-spacing: -0.3px;
    }
    .modal-close {
      width: 32px; height: 32px;
      border-radius: 50%; border: 1px solid #e5e5e5;
      background: #f5f5f5; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem; color: #555;
      transition: background .2s;
    }
    .modal-close:hover { background: #eee; }
    .modal-section { margin-bottom: 20px; }
    .modal-section h3 {
      font-size: .75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: #aaa; margin-bottom: 8px;
    }
    .modal-section p {
      font-size: .84rem; color: #444;
      line-height: 1.6;
    }
    .modal-section ul {
      margin: 8px 0 0 18px;
      font-size: .84rem; color: #444;
      line-height: 1.7;
    }
    .modal-section a { color: #10b981; }
    .modal-divider {
      height: 1px; background: #f0f0f0;
      margin: 16px 0;
    }

    #hidden-link { display: none; }

      left: 0;

      transform: translateX(-600px);
    }
